<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Coronel Michello 20122 · Filtro de perfil</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;900&family=Barlow:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --azul-escuro: #112236;
      --azul:        #1c3a5e;
      --azul-claro:  #3f6da3;
      --dourado:     #d8b04a;
      --dourado-esc: #b8912f;
      --branco:      #ffffff;
      --fundo:       #0a1626;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Barlow', sans-serif;
      background: radial-gradient(circle at top, #16304f 0%, var(--fundo) 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 16px 48px;
      color: var(--branco);
    }

    .header { text-align: center; margin-bottom: 20px; width: 100%; max-width: 500px; }

    .logo-placeholder {
      width: min(230px, 62vw);
      margin: 0 auto 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .logo-placeholder img { max-width: 100%; object-fit: contain; }

    .header-sub {
      font-size: 0.85rem;
      color: var(--dourado);
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    .format-selector { width: min(400px, 90vw); margin-bottom: 18px; }

    .format-label {
      font-size: 0.72rem;
      color: #92a6bd;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 8px;
      display: block;
    }

    .format-options { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }

    .format-btn {
      background: rgba(255,255,255,0.05);
      border: 2px solid rgba(255,255,255,0.12);
      border-radius: 14px;
      padding: 12px 8px;
      cursor: pointer;
      transition: all .2s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      color: #b9c7d8;
      font-family: 'Barlow', sans-serif;
    }
    .format-btn:hover { border-color: var(--azul-claro); background: rgba(63,109,163,0.14); color: #fff; }
    .format-btn.active {
      border-color: var(--dourado);
      background: rgba(216,176,74,0.10);
      color: #fff;
      box-shadow: 0 0 16px rgba(216,176,74,0.18);
    }

    .format-icon { display: flex; align-items: center; justify-content: center; }
    .shape-post    { width: 36px; height: 36px; border: 2.5px solid currentColor; border-radius: 6px; opacity: .9; }
    .shape-stories { width: 22px; height: 36px; border: 2.5px solid currentColor; border-radius: 5px; opacity: .9; }
    .shape-perfil  { width: 36px; height: 36px; border: 2.5px solid currentColor; border-radius: 50%; opacity: .9; }

    .format-name { font-size: .75rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; }
    .format-size { font-size: .65rem; opacity: .6; font-weight: 400; }

    .preview-wrap {
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .circle-outer {
      border-radius: 50%;
      padding: 8px;
      background: linear-gradient(45deg, var(--dourado-esc), var(--dourado), var(--dourado-esc));
      box-shadow: 0 25px 50px rgba(0,0,0,0.5);
    }

    .rect-outer {
      padding: 8px;
      background: linear-gradient(45deg, var(--dourado-esc), var(--dourado), var(--dourado-esc));
      box-shadow: 0 25px 50px rgba(0,0,0,0.5);
    }

    #cv { width: 100%; height: 100%; display: block; }

    .controls {
      width: min(400px, 90vw);
      display: flex; flex-direction: column; gap: 16px;
      background: rgba(255,255,255,0.05);
      padding: 24px;
      border-radius: 24px;
      border: 1px solid rgba(255,255,255,0.1);
      backdrop-filter: blur(15px);
    }

    .btn-upload {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      background: var(--azul); color: #fff;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 1.1rem; font-weight: 700; letter-spacing: .06em;
      text-transform: uppercase; border: none; border-radius: 12px;
      padding: 16px 20px; cursor: pointer;
      box-shadow: 0 4px 15px rgba(28,58,94,0.4);
      transition: all .2s;
    }
    .btn-upload:hover { transform: translateY(-2px); background: var(--azul-escuro); }

    input[type="file"] { display: none; }

    .zoom-row { display: flex; align-items: center; gap: 12px; }
    .zoom-row label { font-size: .75rem; color: #92a6bd; font-weight: 700; text-transform: uppercase; min-width: 50px; }
    input[type="range"] { flex: 1; accent-color: var(--dourado); cursor: pointer; height: 6px; }

    .toggle-row {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; padding: 4px 2px;
    }
    .toggle-row span {
      font-size: .78rem; color: #cdd8e5; font-weight: 700;
      text-transform: uppercase; letter-spacing: .04em;
    }
    .switch { position: relative; width: 52px; height: 30px; flex-shrink: 0; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; inset: 0; cursor: pointer;
      background: rgba(255,255,255,0.18); border-radius: 30px; transition: .2s;
    }
    .slider::before {
      content: ""; position: absolute; height: 22px; width: 22px; left: 4px; top: 4px;
      background: #fff; border-radius: 50%; transition: .2s;
    }
    .switch input:checked + .slider { background: var(--dourado); }
    .switch input:checked + .slider::before { transform: translateX(22px); }

    .btn-row { display: flex; gap: 12px; }

    .btn-rotate {
      background: transparent; border: 2px solid rgba(255,255,255,0.2); color: #fff;
      width: 56px; height: 56px; border-radius: 12px;
      cursor: pointer; flex-shrink: 0; transition: all .2s;
      display: flex; align-items: center; justify-content: center;
    }
    .btn-rotate:hover { background: rgba(255,255,255,0.1); border-color: var(--dourado); }

    .btn-download {
      flex: 1; display: flex; align-items: center; justify-content: center; gap: 10px;
      background: var(--dourado); color: #2b2100;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 1.1rem; font-weight: 900; letter-spacing: .06em;
      text-transform: uppercase; border: none; border-radius: 12px;
      padding: 16px 20px; cursor: pointer;
      box-shadow: 0 4px 15px rgba(216,176,74,0.3);
      transition: all .2s;
    }
    .btn-download:hover { transform: translateY(-2px); filter: brightness(1.06); }
    .btn-download:disabled { opacity: .3; cursor: not-allowed; transform: none; }

    .hint { font-size: .8rem; color: #7f92a8; text-align: center; }
    footer { margin-top: 40px; font-size: .75rem; color: #5b6d82; text-align: center; font-weight: 600; }
  </style>
</head>
<body>

<div class="header">
  <div class="logo-placeholder"><img id="logoTopo" alt="Coronel Michello 20122" /></div>
  <p class="header-sub">Filtro oficial de perfil</p>
</div>

<div class="format-selector">
  <span class="format-label">Selecione seu formato</span>
  <div class="format-options">
    <button class="format-btn active" data-format="perfil">
      <div class="format-icon"><div class="shape-perfil"></div></div>
      <div>
        <div class="format-name">Perfil</div>
        <div class="format-size">1000×1000</div>
      </div>
    </button>
    <button class="format-btn" data-format="post">
      <div class="format-icon"><div class="shape-post"></div></div>
      <div>
        <div class="format-name">Post</div>
        <div class="format-size">1080×1080</div>
      </div>
    </button>
    <button class="format-btn" data-format="stories">
      <div class="format-icon"><div class="shape-stories"></div></div>
      <div>
        <div class="format-name">Stories</div>
        <div class="format-size">1080×1920</div>
      </div>
    </button>
  </div>
</div>

<div class="preview-wrap" id="previewWrap"></div>

<div class="controls">
  <label class="btn-upload" for="fi">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
      <polyline points="17 8 12 3 7 8"/>
      <line x1="12" y1="3" x2="12" y2="15"/>
    </svg>
    Escolher outra foto
  </label>
  <input type="file" id="fi" accept="image/*" />

  <div class="zoom-row">
    <label>🔍 Zoom</label>
    <input type="range" id="zoomR" min="0.5" max="3" step="0.01" value="1" />
  </div>

  <div class="toggle-row">
    <span>Aparecer com o Coronel</span>
    <label class="switch">
      <input type="checkbox" id="coronelChk" checked />
      <span class="slider"></span>
    </label>
  </div>

  <div class="btn-row">
    <button class="btn-rotate" id="rotBtn" title="Girar 90°">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M23 4v6h-6"/>
        <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
      </svg>
    </button>
    <button class="btn-download" id="dlBtn" disabled>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="7 10 12 15 17 10"/>
        <line x1="12" y1="15" x2="12" y2="3"/>
      </svg>
      Baixar minha foto
    </button>
  </div>

  <p class="hint">👆 Clique na imagem para escolher sua foto · arraste para ajustar</p>
</div>

<footer>Coronel Michello · Deputado Distrital · 20122</footer>

  let userImg = null;
  let comCoronel = true;
  let zoom = 1, rot = 0, ox = 0, oy = 0;
  let cv, ctx, circ;

  function carregar(src) {
    const o = { img: new Image(), ok: false };
    o.img.onload  = () => { o.ok = true;  draw(); };
    o.img.onerror = () => { o.ok = false; draw(); };
    o.img.src = src;
    return o;
  }

  const CORONEL = carregar(IMG_CORONEL);
  const BLOCO   = carregar(IMG_BLOCO);

  const prop = o => o.img.naturalWidth / o.img.naturalHeight;

  /* ================= Preview =================================== */
  function buildPreview() {
    const wrap = document.getElementById('previewWrap');
    wrap.innerHTML = '';

    const fmt = FORMATS[currentFormat];
    const ratio = fmt.cw / fmt.ch;

    let pw, ph;
    if (ratio >= 1) { pw = Math.min(MAX_PREVIEW_W, MAX_PREVIEW_H * ratio); ph = pw / ratio; }
    else            { ph = Math.min(MAX_PREVIEW_H, MAX_PREVIEW_W / ratio); pw = ph * ratio; }

    const outer = document.createElement('div');
    const inner = document.createElement('div');
    inner.style.cssText = 'position:relative;overflow:hidden;cursor:grab;background:#fff;' +
                          'touch-action:none;user-select:none;width:100%;height:100%;';

    if (fmt.circular) {
      const size = Math.min(pw, ph);
      outer.className = 'circle-outer';
      outer.style.width = size + 'px';
      outer.style.height = size + 'px';
      inner.style.borderRadius = '50%';
    } else {
      outer.className = 'rect-outer';
      outer.style.borderRadius = '20px';
      outer.style.width = pw + 'px';
      outer.style.height = ph + 'px';
      inner.style.borderRadius = '12px';
    }

    cv = document.createElement('canvas');
    cv.id = 'cv';
    cv.width  = fmt.cw;
    cv.height = fmt.ch;
    ctx = cv.getContext('2d');

    inner.appendChild(cv);
    outer.appendChild(inner);
    wrap.appendChild(outer);

    circ = inner;
    attachDragListeners();
    draw();
  }

  /* ================= Arte ====================================== */

  /* Ele entra pela direita e desce até passar do topo da faixa, que
     cobre os ombros. Por isso é desenhado ANTES da faixa.            */
  function drawCoronel() {
    if (!CORONEL.ok || !comCoronel) return;
    const fmt = FORMATS[currentFormat], cfg = LAYOUT[currentFormat];
    const CW = fmt.cw, CH = fmt.ch, s = CW / 1000;

    const h = CH * cfg.corH;
    const w = h * prop(CORONEL);
    const x = CW * cfg.corCX - w / 2;
    const y = CH * cfg.corBase - h;

    ctx.save();
    ctx.shadowColor = 'rgba(4,14,28,0.42)';
    ctx.shadowBlur = 34 * s;
    ctx.shadowOffsetX = -12 * s;
    ctx.shadowOffsetY = 6 * s;
    ctx.drawImage(CORONEL.img, x, y, w, h);
    ctx.restore();
  }

  /* Escurecimento suave logo acima da faixa: integra a foto do apoiador
     com o azul do rodapé sem criar uma segunda borda.                  */
  function drawScrim() {
    const fmt = FORMATS[currentFormat], cfg = LAYOUT[currentFormat];
    const CW = fmt.cw, CH = fmt.ch;
    const ini = CH * (cfg.bandTop - 0.16);
    const g = ctx.createLinearGradient(0, ini, 0, CH * cfg.bandTop);
    g.addColorStop(0.00, 'rgba(17,34,54,0)');
    g.addColorStop(0.55, 'rgba(17,34,54,0.22)');
    g.addColorStop(1.00, 'rgba(17,34,54,0.62)');
    ctx.fillStyle = g;
    ctx.fillRect(0, ini, CW, CH * cfg.bandTop - ini);
  }

  function drawFaixa() {
    const fmt = FORMATS[currentFormat], cfg = LAYOUT[currentFormat];
    const CW = fmt.cw, CH = fmt.ch;
    const top = CH * cfg.bandTop;
    ctx.fillStyle = AZUL;
    ctx.fillRect(0, top, CW, CH - top);
  }

  function drawBloco() {
    if (!BLOCO.ok) return;
    const fmt = FORMATS[currentFormat], cfg = LAYOUT[currentFormat];
    const CW = fmt.cw, CH = fmt.ch;
    const top = CH * cfg.bandTop;
    const bandH = CH - top;
    const bh = bandH * cfg.blocoH;
    const bw = bh * prop(BLOCO);
    ctx.drawImage(BLOCO.img, (CW - bw) / 2, top + (bandH - bh) / 2, bw, bh);
  }

  /* CNPJ na vertical, à esquerda, como na arte oficial. */
  function drawCnpj() {
    const fmt = FORMATS[currentFormat], cfg = LAYOUT[currentFormat];
    const CW = fmt.cw, CH = fmt.ch, s = CW / 1000;
    ctx.save();
    ctx.translate(CW * 0.045, CH * cfg.bandTop - CH * 0.035);
    ctx.rotate(-Math.PI / 2);
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.font = '700 ' + (22 * s) + "px 'Barlow', sans-serif";
    ctx.fillStyle = 'rgba(255,255,255,0.92)';
    ctx.shadowColor = 'rgba(0,0,0,0.55)';
    ctx.shadowBlur = 8 * s;
    ctx.fillText(CNPJ, 0, 0);
    ctx.restore();
  }

  /* Convite desenhado no próprio fundo da arte, só enquanto não há foto */
  function drawConvite() {
    const fmt = FORMATS[currentFormat], cfg = LAYOUT[currentFormat];
    const CW = fmt.cw, CH = fmt.ch, s = CW / 1000;
    const cx = CW * 0.28, cy = CH * cfg.bandTop * 0.48;

    ctx.save();
    ctx.strokeStyle = '#b9c3cf';
    ctx.lineWidth = 5 * s;
    ctx.setLineDash([14 * s, 12 * s]);
    ctx.beginPath();
    ctx.arc(cx, cy, 62 * s, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(cx - 26 * s, cy); ctx.lineTo(cx + 26 * s, cy);
    ctx.moveTo(cx, cy - 26 * s); ctx.lineTo(cx, cy + 26 * s);
    ctx.stroke();

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#8593a3';
    ctx.font = '900 ' + (44 * s) + "px 'Barlow Condensed', sans-serif";
    ctx.fillText('CLIQUE AQUI', cx, cy + 118 * s);
    ctx.font = '600 ' + (27 * s) + "px 'Barlow', sans-serif";
    ctx.fillText('para escolher sua foto', cx, cy + 158 * s);
    ctx.restore();
  }

  function draw() {
    if (!cv || !ctx) return;
    const fmt = FORMATS[currentFormat];
    const CW = fmt.cw, CH = fmt.ch;
    ctx.clearRect(0, 0, CW, CH);

    if (userImg) {
      ctx.save();
      ctx.translate(CW / 2 + ox, CH / 2 + oy);
      ctx.rotate(rot * Math.PI / 180);
      ctx.scale(zoom, zoom);
      const iw = userImg.naturalWidth, ih = userImg.naturalHeight;
      const base = Math.max(CW / iw, CH / ih);
      ctx.drawImage(userImg, -iw * base / 2, -ih * base / 2, iw * base, ih * base);
      ctx.restore();
    } else {
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, CW, CH);
    }

    if (!userImg) drawConvite();
    drawCoronel();
    drawScrim();
    drawFaixa();
    drawBloco();
    drawCnpj();
  }

  /* ================= Interações ================================ */
  document.querySelectorAll('.format-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.format-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentFormat = btn.dataset.format;
      zoom = 1; rot = 0; ox = 0; oy = 0;
      document.getElementById('zoomR').value = 1;
      buildPreview();
      document.getElementById('dlBtn').disabled = !userImg;
    });
  });

  document.getElementById('coronelChk').addEventListener('change', e => {
    comCoronel = e.target.checked;
    draw();
  });

  document.getElementById('fi').addEventListener('change', e => {
    const f = e.target.files[0];
    if (!f) return;
    const reader = new FileReader();
    reader.onload = ev => {
      const img = new Image();
      img.onload = () => {
        userImg = img;
        zoom = 1; rot = 0; ox = 0; oy = 0;
        document.getElementById('zoomR').value = 1;
        document.getElementById('dlBtn').disabled = false;
        draw();
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(f);
    e.target.value = '';
  });

  document.getElementById('zoomR').addEventListener('input', e => {
    zoom = parseFloat(e.target.value);
    draw();
  });

  document.getElementById('rotBtn').addEventListener('click', () => {
    rot = (rot + 90) % 360;
    draw();
  });

  let dragging = false, hasMoved = false;
  let dragStart = { x: 0, y: 0 };
  let oxStart = 0, oyStart = 0, lastPinch = null;

  function toCanvas(clientX, clientY) {
    const rect = cv.getBoundingClientRect();
    return {
      x: (clientX - rect.left) * (cv.width  / rect.width),
      y: (clientY - rect.top)  * (cv.height / rect.height),
    };
  }

  function attachDragListeners() {
    circ.addEventListener('mousedown', e => {
      if (!userImg) return;
      e.preventDefault();
      dragging = true; hasMoved = false;
      dragStart = toCanvas(e.clientX, e.clientY);
      oxStart = ox; oyStart = oy;
    });

    circ.addEventListener('touchstart', e => {
      if (!userImg) return;
      if (e.touches.length === 1) {
        e.preventDefault();
        dragging = true; lastPinch = null;
        dragStart = toCanvas(e.touches[0].clientX, e.touches[0].clientY);
        oxStart = ox; oyStart = oy;
      }
    }, { passive: false });

    circ.addEventListener('touchmove', e => {
      e.preventDefault();
      if (e.touches.length === 2) {
        dragging = false;
        const dist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        if (lastPinch) {
          zoom = Math.min(3, Math.max(0.5, zoom * dist / lastPinch));
          document.getElementById('zoomR').value = zoom;
          draw();
        }
        lastPinch = dist;
        return;
      }
      if (!dragging || e.touches.length !== 1) return;
      lastPinch = null;
      const p = toCanvas(e.touches[0].clientX, e.touches[0].clientY);
      ox = oxStart + (p.x - dragStart.x);
      oy = oyStart + (p.y - dragStart.y);
      draw();
    }, { passive: false });

    circ.addEventListener('touchend', () => { dragging = false; lastPinch = null; });

    circ.addEventListener('click', () => {
      if (!hasMoved) document.getElementById('fi').click();
    });
  }

  window.addEventListener('mousemove', e => {
    if (!dragging) return;
    hasMoved = true;
    const p = toCanvas(e.clientX, e.clientY);
    ox = oxStart + (p.x - dragStart.x);
    oy = oyStart + (p.y - dragStart.y);
    draw();
  });
  window.addEventListener('mouseup', () => { dragging = false; });

 function supportsFileShare() {
  if (!navigator.canShare) return false;
  try {
    const testFile = new File([new Blob(['x'])], 'test.png', { type: 'image/png' });
    return navigator.canShare({ files: [testFile] });
  } catch (e) {
    return false;
  }
}

document.getElementById('dlBtn').addEventListener('click', async () => {
  draw();
  const fmt = FORMATS[currentFormat];
  const tmp = document.createElement('canvas');
  tmp.width = fmt.cw; tmp.height = fmt.ch;
  const tc = tmp.getContext('2d');

  if (fmt.circular) {
    const S = fmt.cw;
    tc.beginPath();
    tc.arc(S / 2, S / 2, S / 2, 0, Math.PI * 2);
    tc.closePath();
    tc.clip();
  }
  tc.drawImage(cv, 0, 0);

  const fileName = fmt.label + '.png';

  tmp.toBlob(async (blob) => {
    if (!blob) return;
    const file = new File([blob], fileName, { type: 'image/png' });
    const canShareFiles = supportsFileShare() && navigator.canShare({ files: [file] });

    if (canShareFiles) {
      try {
        await navigator.share({ files: [file], title: 'Coronel Michello 20122' });
        return;
      } catch (err) {
        if (err && err.name === 'AbortError') return;
      }
    }

    const a = document.createElement('a');
    a.download = fileName;
    a.href = URL.createObjectURL(blob);
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  }, 'image/png');
});

  buildPreview();
</script>
</body>
</html>
